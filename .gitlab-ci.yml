# GitLab CI/CD Pipeline Configuration for OpenMail
# Self-hosted Webmail application built with Laravel 12, Livewire 3, Tailwind CSS 4, and Vite 7.
# Primary deployment targets: Shared hosting (cPanel) & VPS.

stages:
  - build
  - lint
  - test
  - package

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    # Run pipeline on merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run pipeline on the default branch (master)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Run pipeline on release tags (e.g. v1.0.0)
    - if: $CI_COMMIT_TAG

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  APP_ENV: "testing"
  APP_KEY: "base64:yWkYcFYdR67svSY0Bkl1USG9T56SmFrm6TRRYFyAlwo="
  DB_CONNECTION: "sqlite"
  DB_DATABASE: ":memory:"

default:
  interruptible: true

# =========================================================================
# Stage 1: Build (Dependencies & Assets)
# =========================================================================

build:backend:
  stage: build
  image: composer:2
  cache:
    key:
      files:
        - composer.lock
    paths:
      - .composer-cache/
  before_script:
    - mkdir -p .composer-cache
  script:
    - composer install --prefer-dist --optimize-autoloader --no-progress
  artifacts:
    name: "backend-vendor-$CI_COMMIT_REF_SLUG"
    paths:
      - vendor/
    expire_in: 2 hours

build:frontend:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --prefer-offline --legacy-peer-deps
    - npm run build
    - node scripts/check-fontsource-build.js
  artifacts:
    name: "frontend-assets-$CI_COMMIT_REF_SLUG"
    paths:
      - public/build/
    expire_in: 2 hours

# =========================================================================
# Stage 2: Code Quality & Security Auditing
# =========================================================================

lint:pint:
  stage: lint
  image: php:8.4-cli
  dependencies:
    - build:backend
  script:
    - ./vendor/bin/pint --test
  allow_failure: true

security:composer:
  stage: lint
  image: composer:2
  dependencies:
    - build:backend
  before_script:
    - git config --global --add safe.directory "*" || true
  script:
    - composer audit --locked
  allow_failure: true

security:npm:
  stage: lint
  image: node:20-alpine
  dependencies:
    - build:frontend
  script:
    - npm audit --audit-level=high
  allow_failure: true

# =========================================================================
# Stage 3: Automated Testing
# =========================================================================

test:pest:
  stage: test
  image: php:8.4-cli
  dependencies:
    - build:backend
    - build:frontend
  before_script:
    - cp .env.example .env
    - php artisan config:clear
  script:
    - ./vendor/bin/pest --log-junit=junit-report.xml
  artifacts:
    when: always
    reports:
      junit: junit-report.xml
    paths:
      - junit-report.xml
    expire_in: 7 days

# =========================================================================
# Stage 4: Packaging & Release Distribution
# =========================================================================

package:release:
  stage: package
  image: composer:2
  dependencies:
    - build:backend
    - build:frontend
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - apk add --no-cache zip
  script:
    - echo "Pruning development dependencies for production package..."
    - composer install --no-dev --optimize-autoloader --prefer-dist --no-progress
    - RELEASE_VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}"
    - ZIP_NAME="openmail-${RELEASE_VERSION}.zip"
    - 'echo "Generating production release archive: ${ZIP_NAME}..."'
    - |
      zip -q -r "${ZIP_NAME}" \
        app \
        bootstrap \
        config \
        database \
        public \
        resources \
        routes \
        storage \
        vendor \
        artisan \
        composer.json \
        composer.lock \
        package.json \
        .env.example \
        README.md \
        -x "storage/logs/*" \
        -x "storage/framework/cache/*" \
        -x "storage/framework/sessions/*" \
        -x "storage/framework/views/*" \
        -x "tests/*" \
        -x "node_modules/*" \
        -x ".git/*" \
        -x ".planning/*" \
        -x ".gsd/*"
    - ls -lh "${ZIP_NAME}"
  artifacts:
    name: "openmail-release-$CI_COMMIT_REF_SLUG"
    paths:
      - "openmail-*.zip"
    expire_in: 30 days
