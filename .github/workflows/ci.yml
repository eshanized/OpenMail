name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Laravel Pint (PSR-12 Lint)
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Composer Security Audit
        run: composer audit --locked
        continue-on-error: true

      - name: NPM Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  test:
    name: Automated Tests & Build
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:yWkYcFYdR67svSY0Bkl1USG9T56SmFrm6TRRYFyAlwo=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --optimize-autoloader --no-progress

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci --prefer-offline --legacy-peer-deps
          npm run build
          node scripts/check-fontsource-build.js

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan config:clear

      - name: Run Pest Tests
        run: ./vendor/bin/pest
