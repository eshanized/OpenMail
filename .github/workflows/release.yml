name: Release

on:
  push:
    branches:
      - 'v2.0.0'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-and-release:
    name: Package & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Compile Assets
        run: |
          npm ci --prefer-offline --legacy-peer-deps
          npm run build
          node scripts/check-fontsource-build.js

      - name: Prune Development Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Prepare Detailed Release Notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          ref_name = os.environ["GITHUB_REF_NAME"]
          version = ref_name[1:] if ref_name.startswith("v") else ref_name
          changelog = Path("CHANGELOG.md").read_text()
          heading = re.compile(rf"(?m)^## \\[{re.escape(version)}\\](?:[ \\t]+-[^\\n]*)?[ \\t]*$")
          match = heading.search(changelog)
          if match is None:
              raise SystemExit(f"No changelog section found for release {version}")

          next_heading = re.search(r"(?m)^## \\[", changelog[match.end():])
          end = match.end() + next_heading.start() if next_heading else len(changelog)
          notes = changelog[match.start():end].strip()
          Path("release-notes.md").write_text(notes + "\\n")
          print(f"Prepared {len(notes.splitlines())} lines of release notes for {version}")
          PY

      - name: Create Production Release Archive
        id: package
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME:-latest}"
          ZIP_NAME="openmail-${RELEASE_VERSION}.zip"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Generating production release archive: ${ZIP_NAME}..."
          zip -q -r "${ZIP_NAME}" \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            storage \
            vendor \
            artisan \
            composer.json \
            composer.lock \
            package.json \
            .env.example \
            README.md \
            SETUP.md \
            LICENSE \
            CHANGELOG.md \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*" \
            -x "tests/*" \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".planning/*" \
            -x ".gsd/*"
          ls -lh "${ZIP_NAME}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/v2.0.0'
        with:
          name: "OpenMail ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: ${{ steps.package.outputs.zip_name }}
          draft: false
          prerelease: false
