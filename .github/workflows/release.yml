name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-and-release:
    name: Package & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies & Compile Assets
        run: |
          npm ci --prefer-offline --legacy-peer-deps
          npm run build
          node scripts/check-fontsource-build.js

      - name: Prune Development Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Create Production Release Archive
        id: package
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME:-latest}"
          ZIP_NAME="openmail-${RELEASE_VERSION}.zip"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Generating production release archive: ${ZIP_NAME}..."
          zip -q -r "${ZIP_NAME}" \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            storage \
            vendor \
            artisan \
            composer.json \
            composer.lock \
            package.json \
            .env.example \
            README.md \
            SETUP.md \
            LICENSE \
            CHANGELOG.md \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*" \
            -x "tests/*" \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".planning/*" \
            -x ".gsd/*"
          ls -lh "${ZIP_NAME}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "OpenMail ${{ github.ref_name }}"
          body: |
            Release notes for OpenMail ${{ github.ref_name }}. See [CHANGELOG.md](CHANGELOG.md) for full change history and [SETUP.md](SETUP.md) for deployment instructions.
          files: ${{ steps.package.outputs.zip_name }}
          draft: false
          prerelease: false
